name: Audit and Outreach

# Every 10 minutes: audit newly captured sites, check each PDF really belongs
# to its business, email up to 4 owners, and commit the updated spreadsheet.
#
# The cadence comes from the in-job loop, not from cron - GitHub throttles
# high-frequency schedules, so cron only restarts the loop.

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "1 to actually send email, 0 for a dry run"
        required: false
        default: "0"
      hours:
        description: "How long this run should keep working (hours)"
        required: false
        default: "5"
      cap:
        description: "Emails per 10-minute cycle"
        required: false
        default: "4"

permissions:
  contents: write

concurrency:
  group: outreach
  cancel-in-progress: false

jobs:
  audit-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      OUTREACH_LIVE: ${{ github.event.inputs.live || '0' }}
      SEND_CAP_PER_RUN: ${{ github.event.inputs.cap || '4' }}
      DAILY_CEILING: ${{ vars.DAILY_CEILING || '0' }}
      AUDIT_BASE: ${{ vars.AUDIT_BASE || 'https://audit.growthsupplyhouse.com' }}
      AUDIT_ENDPOINT: ${{ vars.AUDIT_ENDPOINT }}
      AUDIT_METHOD: ${{ vars.AUDIT_METHOD || 'POST' }}
      AUDIT_FIELD: ${{ vars.AUDIT_FIELD || 'url' }}
      # The audit tool is a page, not an API - two full runs proved no HTTP
      # endpoint answers. Skip straight to the browser and save ~10 minutes a
      # run. Set the repo variable to 0 if an API is ever added.
      AUDIT_SKIP_HTTP: ${{ vars.AUDIT_SKIP_HTTP || '1' }}
      SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      REPORT_TO: ${{ secrets.REPORT_TO }}
      POSTAL_ADDRESS: ${{ vars.POSTAL_ADDRESS }}
      SITE_URL: ${{ vars.SITE_URL || 'https://www.growthsupplyhouse.com' }}
      FROM_NAME: ${{ vars.FROM_NAME || 'Growth Supply House' }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install browser for audit capture
        run: python -m playwright install --with-deps chromium

      - name: Audit and send on a 10 minute cycle
        env:
          RUN_HOURS: ${{ github.event.inputs.hours || '5' }}
        run: |
          set -u
          git config user.name  "leadgen-bot"
          git config user.email "leadgen-bot@users.noreply.github.com"

          SECONDS_TO_RUN=$(python -c "print(int(float('${RUN_HOURS}') * 3600))")
          END=$(( $(date +%s) + SECONDS_TO_RUN ))
          CYCLE=0

          while [ "$(date +%s)" -lt "$END" ]; do
            CYCLE=$((CYCLE + 1))
            CYCLE_START=$(date +%s)
            echo "::group::cycle $CYCLE ($(date -u '+%H:%M:%S') UTC)"

            # 6 per cycle keeps a cycle inside the 10 minute window (browser
            # capture runs about a minute per site) and still outruns the 4
            # emails a cycle sends.
            python outreach.py audit --limit 6 || echo "audit stage had failures, continuing"
            python outreach.py verify || true
            python outreach.py send --cap "${SEND_CAP_PER_RUN}" || echo "send stage had failures, continuing"

            # Email the operator the spreadsheet once an hour.
            if [ $(( CYCLE % 6 )) -eq 1 ]; then
              python outreach.py report || true
            fi

            git add output/ audits/ seen_domains.sqlite3 || true
            if git diff --cached --quiet; then
              echo "nothing changed this cycle"
            else
              git commit -q -m "Audit + outreach: $(date -u '+%Y-%m-%d %H:%M') UTC (cycle $CYCLE)"
              for attempt in 1 2 3; do
                git push -q && break
                git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" || true
                sleep $((attempt * 5))
              done
            fi
            echo "::endgroup::"

            [ "$(date +%s)" -ge "$END" ] && break

            # Hold the 10 minute cadence regardless of how long the cycle took.
            ELAPSED=$(( $(date +%s) - CYCLE_START ))
            WAIT=$(( 600 - ELAPSED ))
            [ "$WAIT" -gt 0 ] && sleep "$WAIT"
          done

          echo "Loop finished after $CYCLE cycles."

      - name: Upload audits and spreadsheet
        if: always() && hashFiles('audits/*.pdf') != ''
        uses: actions/upload-artifact@v4
        with:
          name: audits-${{ github.run_id }}
          path: |
            audits/*.pdf
            output/leads_master.xlsx
          retention-days: 30
