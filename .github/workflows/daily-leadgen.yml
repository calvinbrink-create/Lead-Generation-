name: Daily Lead Generation

on:
  # Restart net only. GitHub throttles high-frequency schedules hard, so the
  # cron is not what gives the every-few-minutes cadence - the in-job loop
  # below is. The cron just (re)starts that loop if it is not running.
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "How long this run should keep working (hours)"
        required: false
        default: "5"

permissions:
  contents: write

concurrency:
  group: leadgen
  cancel-in-progress: false

jobs:
  generate-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape continuously
        env:
          RUN_HOURS: ${{ github.event.inputs.hours || '5' }}
        run: |
          set -u
          git config user.name  "leadgen-bot"
          git config user.email "leadgen-bot@users.noreply.github.com"

          SECONDS_TO_RUN=$(python -c "print(int(float('${RUN_HOURS}') * 3600))")
          END=$(( $(date +%s) + SECONDS_TO_RUN ))
          CYCLE=0

          while [ "$(date +%s)" -lt "$END" ]; do
            CYCLE=$((CYCLE + 1))
            echo "::group::cycle $CYCLE ($(date -u '+%H:%M:%S') UTC)"
            python leadgen.py --queries 12 --max-seconds 240 || echo "cycle failed, continuing"

            git add output/ seen_domains.sqlite3 || true
            if git diff --cached --quiet; then
              echo "no new leads this cycle"
            else
              git commit -q -m "Leads: $(date -u '+%Y-%m-%d %H:%M') UTC (cycle $CYCLE)"
              for attempt in 1 2 3; do
                git push -q && break
                echo "push rejected, rebasing onto origin"
                git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" || true
                sleep $((attempt * 5))
              done
            fi
            echo "::endgroup::"

            [ "$(date +%s)" -ge "$END" ] && break
            sleep 60
          done

          echo "Loop finished after $CYCLE cycles."

      - name: Upload Excel as workflow artifact
        if: always() && hashFiles('output/*.xlsx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_id }}
          path: output/*.xlsx
          retention-days: 30
