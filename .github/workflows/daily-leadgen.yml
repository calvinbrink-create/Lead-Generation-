name: Daily Lead Generation

on:
  schedule:
    # Every 10 minutes. GitHub's minimum for scheduled workflows is 5 minutes,
    # and schedules are best-effort under load, so treat this as "roughly every
    # 10-20 minutes" rather than a guarantee.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# One run at a time. Queue rather than cancel, so an in-flight run always gets
# to commit the leads it has already paid for.
concurrency:
  group: leadgen
  cancel-in-progress: false

jobs:
  generate-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run lead generator
        run: python leadgen.py --queries 12 --max-seconds 420

      - name: Commit results back to repo
        run: |
          git config user.name "leadgen-bot"
          git config user.email "leadgen-bot@users.noreply.github.com"
          git add output/ seen_domains.sqlite3
          if git diff --cached --quiet; then
            echo "No new leads this run - nothing to commit."
            exit 0
          fi
          git commit -m "Leads: $(date -u '+%Y-%m-%d %H:%M') UTC"
          # The branch can move between runs; rebase onto it before pushing.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push failed (attempt $attempt); rebasing onto origin and retrying."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((attempt * 5))
          done
          echo "::error::Could not push results after 5 attempts."
          exit 1

      - name: Upload Excel as workflow artifact
        if: hashFiles('output/*.xlsx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_id }}
          path: output/*.xlsx
          retention-days: 30
