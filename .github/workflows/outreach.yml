name: Audit and Outreach

# Runs every day: audit newly captured sites, confirm every one of them has a
# PDF that belongs to it, email up to 4 owners, then send the operator the
# spreadsheet. Sending only happens when OUTREACH_LIVE is set to 1.

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Set to 1 to actually send email (otherwise dry run)"
        required: false
        default: "0"
      audit_limit:
        description: "Max sites to audit this run"
        required: false
        default: "25"
      cap:
        description: "Max outreach emails to send"
        required: false
        default: "4"

permissions:
  contents: write

concurrency:
  group: outreach
  cancel-in-progress: false

jobs:
  audit-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      OUTREACH_LIVE: ${{ github.event.inputs.live || '0' }}
      AUDIT_BASE: https://audit.growthsupplyhouse.com
      AUDIT_ENDPOINT: ${{ vars.AUDIT_ENDPOINT }}
      AUDIT_METHOD: ${{ vars.AUDIT_METHOD || 'POST' }}
      AUDIT_FIELD: ${{ vars.AUDIT_FIELD || 'url' }}
      SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
      SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      REPORT_TO: ${{ secrets.REPORT_TO }}
      POSTAL_ADDRESS: ${{ vars.POSTAL_ADDRESS }}
      SITE_URL: ${{ vars.SITE_URL || 'https://www.growthsupplyhouse.com' }}
      FROM_NAME: ${{ vars.FROM_NAME || 'Growth Supply House' }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run audits on captured sites
        run: python outreach.py audit --limit "${{ github.event.inputs.audit_limit || '25' }}"

      - name: Verify every lead has a PDF that belongs to it
        run: python outreach.py verify

      - name: Send outreach
        run: python outreach.py send --cap "${{ github.event.inputs.cap || '4' }}"

      - name: Email the spreadsheet
        if: always()
        run: python outreach.py report

      - name: Commit audits and updated spreadsheet
        if: always()
        run: |
          git config user.name  "leadgen-bot"
          git config user.email "leadgen-bot@users.noreply.github.com"
          git add output/ audits/ seen_domains.sqlite3 || true
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -q -m "Audits and outreach: $(date -u '+%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3; do
            git push -q && exit 0
            git pull --rebase --autostash -q origin "${GITHUB_REF_NAME}" || true
            sleep $((attempt * 5))
          done
          echo "::error::could not push"
          exit 1

      - name: Upload audits
        if: always() && hashFiles('audits/*.pdf') != ''
        uses: actions/upload-artifact@v4
        with:
          name: audits-${{ github.run_id }}
          path: |
            audits/*.pdf
            output/leads_master.xlsx
          retention-days: 30
